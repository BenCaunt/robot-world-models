known_limitations:
  - The Hugging Face repository is a nested collection, not one root-level LeRobot dataset.
  - The upstream merged directories are incomplete and must not be treated as the 460-episode set.
  - The complete upstream repository includes duplicate video payloads; recipes select exact raw
    members and enforce a byte ceiling before download.
  - No source-held-out test environment is declared, and the README reports uneven recovery
    behavior.
  - A minority of arm samples exceed the nominal -100 to 100 calibrated range; wrist-roll overflow
    and robot-specific calibration need explicit evaluation.
