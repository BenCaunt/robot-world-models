  location_resolved_from_warmhub: true
format:
  adapter: lerobot-v2
  implementation_status: implemented
  codebase_version: v2.1
robot_evidence:
  recorded_with_wref: RecordedWith/huggingface/nashmo/so101
  robot_wref: wh:bencaunt/robot-models/Robot/the-robot-studio/so-arm101
