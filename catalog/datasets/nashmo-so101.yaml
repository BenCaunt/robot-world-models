  - sensor/rgb
  - sensor/proprioception
  - state-space/joint-position
  - action-space/joint-position
  - action-space/gripper-command
  - task/manipulation
episode_schema:
  fps: 30
  total_episodes: 10
  total_frames: 10112
  state:
    dimension: 6
    names:
      - main_shoulder_pan
      - main_shoulder_lift
      - main_elbow_flex
      - main_wrist_flex
      - main_wrist_roll
      - main_gripper
    units: legacy LeRobot degrees for arm joints; normalized 0-100 for gripper
  action:
    dimension: 6
    names:
      - main_shoulder_pan
      - main_shoulder_lift
      - main_elbow_flex
      - main_wrist_flex
      - main_wrist_roll
      - main_gripper
    units: legacy LeRobot degrees for arm joints; normalized 0-100 for gripper
  cameras:
    - observation.images.laptop
    - observation.images.phone1
mixture:
  embodiment: so-arm101
  schema_family: lerobot-joint-position-6d
  domain: physical-tabletop-manipulation
  compatibility_tier: provisional-homogeneous
required_assessments:
  - source/listed
  - meta/info-present
  - meta/features-parse
  - meta/robot-type-present
  - license/present
fixture: null
known_limitations:
  - The dataset-to-robot relationship is alias-derived rather than an exact catalog identifier.
  - The arm joints use LeRobot's legacy degree convention and require the official old-to-new
    calibration transform before use with the new-calibration URDF.
  - The upstream robot package does not define how the LeRobot 0-100 gripper value maps to the URDF
    jaw angle.
  - The first state-only spike deliberately excludes about 210 MB of optional camera video.
